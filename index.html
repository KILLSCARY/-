<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Покоритель P2P 3.0</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="game"></canvas>
    <!-- Иконка Tether (USDT): используется через <use href="#ico-usdt"> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="ico-usdt" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="16" fill="#26A17B"/>
            <path fill="#fff" d="M17.9 17.9c-.1 0-.7.1-2 .1-1.1 0-1.8 0-2.1-.1-3.9-.2-6.8-.9-6.8-1.7s2.9-1.5 6.8-1.7v2.7c.3 0 1 .1 2.1.1 1.3 0 1.9-.1 2-.1v-2.7c3.9.2 6.8.9 6.8 1.7s-2.9 1.5-6.8 1.7zm0-3.6v-2.4h5.4V8.3H8.6v3.6H14v2.4c-4.4.2-7.7 1.1-7.7 2.1s3.3 1.9 7.7 2.1v7.7h3.9v-7.7c4.4-.2 7.7-1.1 7.7-2.1s-3.3-1.9-7.7-2.1z"/>
        </symbol>
        <symbol id="ico-trx" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="16" fill="#EB0029"/>
            <path fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" d="M8 9l16 3.2L15 24.5zM8 9l7 15.5M8 9l10.6 6.6L24 12.2M18.6 15.6L15 24.5"/>
        </symbol>
    </svg>

    <!-- Главная: кошелёк, глава, вкладки «Герои / Забег / Кейсы / Магазин» -->
    <section id="menu" class="screen">
        <div class="hub">
            <div class="hub-top">
                <span class="cur"><svg class="ico-usdt" aria-label="USDT"><use href="#ico-usdt"/></svg><b id="w-usdt">0</b></span>
                <span class="cur"><svg class="ico-usdt" aria-label="TRX"><use href="#ico-trx"/></svg><b id="w-trx">0</b></span>
                <span class="hub-best">Рекорд <b id="menu-best">0</b></span>
            </div>
            <div class="chap">
                <div class="chap-row"><span id="chap-name"></span><b id="chap-num"></b></div>
                <div class="bar"><i id="chap-bar"></i></div>
            </div>

            <!-- Главная: заголовок-«слово» как на лендинге, карусель героев, плитки 01–04 -->
            <div class="view" id="view-run">
                <div class="brand">
                    <p class="label">Игра к курсу</p>
                    <h1 class="word"><span class="metal">Покоритель</span><span class="outline">P2P 3.0</span></h1>
                </div>
                <div class="carousel" id="carousel" aria-label="Выбор героя"></div>
                <div class="tiles" id="tiles">
                    <button id="btn-play" class="tile tile-run"><span class="n">01</span><span class="tile-name" id="play-label">Забег</span><span class="arr" aria-hidden="true">→</span></button>
                    <button class="tile" data-go="cases"><b class="badge" id="tile-cases-badge" hidden>1</b><span class="n">02</span><span class="tile-name">Кейсы</span><span class="tile-sub" id="tile-cases-sub"></span></button>
                    <button class="tile" data-go="shop"><span class="n">03</span><span class="tile-name">NS Store</span><span class="tile-sub" id="tile-shop-sub"></span></button>
                    <button class="tile" data-go="heroes"><span class="n">04</span><span class="tile-name">Герои</span><span class="tile-sub" id="tile-heroes-sub"></span></button>
                </div>
            </div>
            <div class="view sheet" id="view-heroes" hidden>
                <p class="label">Команда</p>
                <h2 class="sheet-title">Герои</h2>
                <div id="heroes-list" class="cards"></div>
            </div>
            <div class="view sheet" id="view-cases" hidden>
                <p class="label">Лут</p>
                <h2 class="sheet-title">Кейсы</h2>
                <div id="cases-list" class="cards"></div>
            </div>
            <div class="view sheet" id="view-shop" hidden>
                <p class="label">Добавки и прокачка</p>
                <h2 class="sheet-title">NS Store</h2>
                <p class="sheet-sub">Магазин добавок Паши. Купленное срабатывает в следующем забеге.</p>
                <div class="seg"><button data-seg="boosts" class="on">Добавки</button><button data-seg="up">Прокачка</button></div>
                <div id="shop-list" class="cards"></div>
            </div>

            <nav class="tabbar">
                <button data-tab="heroes">Герои</button>
                <button data-tab="run" class="on">Забег</button>
                <button data-tab="cases">Кейсы<b id="cases-badge" hidden>1</b></button>
                <button data-tab="shop">Магазин</button>
            </nav>
        </div>
    </section>

    <!-- Открытие кейса -->
    <section id="case-open" class="screen" hidden>
        <div class="panel case-panel">
            <h2 id="case-title"></h2>
            <div class="strip-box"><div class="strip" id="case-strip"></div></div>
            <p id="case-result" class="case-result"></p>
            <button id="btn-case-ok" class="btn btn-main" disabled>ЗАБРАТЬ</button>
        </div>
    </section>

    <div id="toast" hidden></div>

    <!-- Во время игры -->
    <section id="hud" class="screen" hidden>
        <div class="hud-top">
            <div class="chip chip-usdt"><svg class="ico-usdt" aria-label="USDT"><use href="#ico-usdt"/></svg><b id="hud-usdt">0</b></div>
            <div class="chip"><b id="hud-score">0</b></div>
            <div id="hud-boost" class="chip chip-boost" hidden></div>
            <div id="hud-fx" class="chip chip-fx" hidden></div>
            <button id="btn-sound" class="icon" aria-label="Звук">🔊</button>
            <button id="btn-pause" class="icon" aria-label="Пауза">⏸</button>
        </div>
        <div id="countdown" hidden></div>
    </section>

    <!-- Пауза -->
    <section id="pause" class="screen" hidden>
        <div class="panel">
            <h2>Пауза</h2>
            <button id="btn-resume" class="btn btn-main">ПРОДОЛЖИТЬ</button>
            <button id="btn-menu" class="btn">В МЕНЮ</button>
        </div>
    </section>

    <!-- Проигрыш -->
    <section id="over" class="screen" hidden>
        <div class="panel">
            <p id="over-cause" class="cause"></p>
            <div class="score-big" id="over-score">0</div>
            <div class="stats">
                <span id="over-usdt"></span>
                <span id="over-dist"></span>
            </div>
            <p id="over-best" class="best"></p>
            <p id="over-wallet" class="wallet-line"></p>
            <button id="btn-appeal" class="btn btn-appeal" hidden></button>
            <button id="btn-again" class="btn btn-main">ЕЩЁ РАЗ</button>
            <button id="btn-over-menu" class="btn">В МЕНЮ</button>
            <button id="btn-share" class="btn">ПОДЕЛИТЬСЯ</button>
            <button id="btn-course" class="btn btn-ghost">Научиться P2P по-настоящему →</button>
        </div>
    </section>

    <script type="module" src="js/game.js"></script>
</body>
</html>
