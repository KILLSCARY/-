<script type="module">
// FBX из Meshy → GLB: свои текстуры (jpg), склейка вершин, разбиение на части, анимации персонажей.
import * as THREE from "../js/vendor/three.module.js";
import { FBXLoader } from "../js/vendor/jsm/FBXLoader.js";
import { mergeVertices } from "../js/vendor/jsm/BufferGeometryUtils.js";
import { GLTFExporter } from "../js/vendor/jsm/GLTFExporter.js";
import { GLTFLoader } from "../js/vendor/jsm/GLTFLoader.js";
THREE.ColorManagement.legacyMode = false;
const q = new URLSearchParams(location.search);
const job = JSON.parse(q.get("job"));
// job.glb — вместо FBX готовый .glb из Meshy (только пережать текстуры); job.texExt — окончание файлов текстур
// (по умолчанию ".lo.jpg", заранее уменьшенные; ".png" — исходники из архива Meshy);
// job.sizes — {суффикс: максимальная сторона текстуры}, например {"": 1024, "_lite": 512}: сохранить несколько версий
const fbx = (f) => new Promise((res, rej) => new FBXLoader().load(f, res, undefined, rej));
const glb = (f) => new Promise((res, rej) => new GLTFLoader().load(f, res, undefined, rej));
const tex = (f, srgb) => new Promise((res) => new THREE.TextureLoader().load(f, (t) => {
  if (srgb) t.encoding = THREE.sRGBEncoding; t.userData.mimeType = "image/jpeg"; res(t);
}, undefined, () => res(null)));
// значение в sizes — сторона текстуры или { tex, tris }: tris — до скольких треугольников упростить сетку
// (meshoptimizer; версии сохраняются по порядку, и каждая следующая упрощается из предыдущей)
const sizes = job.sizes || { "": undefined };
const save = async (name, obj, animations = []) => {
  for (const [suffix, opt] of Object.entries(sizes)) {
    const { tex: maxTextureSize, tris } = typeof opt === "object" && opt ? opt : { tex: opt };
    if (tris) (report.simplified ||= {})[name + suffix] = await simplifyTo(obj, tris);
    const buf = await new Promise((res, rej) => new GLTFExporter().parse(obj, res, rej, { binary: true, animations, maxTextureSize: maxTextureSize ?? Infinity }));
    await fetch("/save?name=" + encodeURIComponent(name + suffix), { method: "POST", body: buf });
  }
};
async function simplifyTo(obj, target) {
  const { MeshoptSimplifier } = await import("https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_simplifier.module.js");
  await MeshoptSimplifier.ready;
  MeshoptSimplifier.useExperimentalFeatures = true; // simplifyWithAttributes (job.weldUv) в 0.21 — «экспериментальная»
  const meshes = []; obj.traverse((m) => { if (m.isMesh && m.geometry.index) meshes.push(m); });
  const total = meshes.reduce((s, m) => s + m.geometry.index.count / 3, 0);
  if (total <= target) return total;
  const k = target / total;
  let after = 0;
  for (const m of meshes) {
    const g = m.geometry, idx = new Uint32Array(g.index.array);
    const pos = new Float32Array(g.attributes.position.array);
    // job.error — допустимая погрешность (доля размера модели); job.weld — сначала склеить вершины по одной позиции:
    // у сеток с множеством швов (разные UV в одной точке) упрощение иначе упирается в их края
    if (job.weld) {
      const first = new Map();
      for (let i = 0; i < idx.length; i++) {
        const v = idx[i], key = `${pos[v * 3].toFixed(5)},${pos[v * 3 + 1].toFixed(5)},${pos[v * 3 + 2].toFixed(5)}`;
        if (!first.has(key)) first.set(key, v);
        idx[i] = first.get(key);
      }
    }
    // job.weldUv — склеить только вершины с одной позицией И одной точкой развёртки: у Meshy каждый треугольник
    // часто со своими вершинами, и упрощать нечего (всё — края), а склейка по одной позиции рвёт швы текстуры (пятна)
    const uv = g.attributes.uv && new Float32Array(g.attributes.uv.array);
    if (job.weldUv && uv) {
      const first = new Map();
      for (let i = 0; i < idx.length; i++) {
        const v = idx[i], key = `${pos[v * 3].toFixed(5)},${pos[v * 3 + 1].toFixed(5)},${pos[v * 3 + 2].toFixed(5)},${uv[v * 2].toFixed(4)},${uv[v * 2 + 1].toFixed(4)}`;
        if (!first.has(key)) first.set(key, v);
        idx[i] = first.get(key);
      }
    }
    const count = Math.max(3, Math.floor(idx.length * k / 3) * 3);
    // с развёрткой — упрощение учитывает и её (швы и рисунок текстуры не ползут)
    const [out] = job.weldUv && uv && MeshoptSimplifier.simplifyWithAttributes
      ? MeshoptSimplifier.simplifyWithAttributes(idx, pos, 3, uv, 2, [job.uvWeight ?? 1, job.uvWeight ?? 1], null, count, job.error ?? 0.05)
      : MeshoptSimplifier.simplify(idx, pos, 3, count, job.error ?? 0.05);
    g.setIndex(new THREE.BufferAttribute(out, 1));
    m.geometry = compact(g);
    after += out.length / 3;
  }
  return Math.round(after);
}
const material = async () => {
  const ext = job.texExt ?? ".lo.jpg";
  const map = await tex(job.tex + ext, true), nor = await tex(job.tex + "_normal" + ext);
  return new THREE.MeshStandardMaterial({ map, normalMap: nor, roughness: 0.75, metalness: job.metal ?? 0.1 });
};
const report = {};
try {
  if (job.glb) { // готовый .glb: текстуры в jpeg, анимации как есть
    const g = await glb(job.glb);
    g.scene.traverse((m) => { if (m.isMesh) for (const mt of [].concat(m.material)) for (const k of ["map", "normalMap", "roughnessMap", "metalnessMap", "emissiveMap"]) if (mt[k]) mt[k].userData.mimeType = "image/jpeg"; });
    let tris = 0; g.scene.traverse((m) => { if (m.isMesh) tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
    // job.clips — клипы из других .glb Meshy с тем же ригом: { имя: [файл, номер клипа в нём] } (набор действий Meshy —
    // один файл, клип на действие по порядку). Без масштаба, бедро стоит на месте по X/Z (бег «на дорожке»), высота — как есть
    // job.lean — герой для телефона: без карты металла/шероховатости (третья текстура) и без двусторонних граней
    if (job.lean) g.scene.traverse((m) => { if (m.isMesh) for (const mt of [].concat(m.material)) {
      mt.metalnessMap = mt.roughnessMap = null; mt.metalness = job.metal ?? 0.1; mt.roughness = job.rough ?? 0.7; mt.side = THREE.FrontSide;
    } });
    let clips = g.animations;
    if (job.clips) {
      clips = [];
      const files = {};
      for (const [name, [file, i = 0]] of Object.entries(job.clips)) {
        const src = files[file] ||= await glb(file);
        let clip = src.animations[i].clone(); clip.name = name;
        // кости, кроме бедра, только поворачиваются: дорожки позиции Meshy пишет каждой — постоянные, лишний вес (job.lean)
        clip.tracks = clip.tracks.filter((t) => !t.name.endsWith(".scale") && !(job.lean && t.name.endsWith(".position") && !/Hips\.position$/.test(t.name)));
        // job.trim — { имя: [с, по] } в секундах: взять кусок длинного клипа (спотыкание Meshy — 11 с, нужна секунда)
        const tr = job.trim?.[name];
        if (tr) { clip = THREE.AnimationUtils.subclip(clip, name, Math.round(tr[0] * 30), Math.round(tr[1] * 30), 30); }
        for (const t of clip.tracks) if (/Hips\.position$/.test(t.name)) {
          const v = t.values, x0 = v[0], z0 = v[2];
          for (let k = 0; k < v.length; k += 3) { v[k] = x0; v[k + 2] = z0; }
        }
        clips.push(clip);
      }
    }
    report.clips = clips.map((c) => [c.name, +c.duration.toFixed(2)]); report.tris = tris;
    await save(job.out, g.scene, clips);
    window.DONE = report;
    throw null;
  }
  const o = await fbx(job.fbx);
  o.updateMatrixWorld(true);
  const mat = await material();
  if (job.anims) {
    // персонаж: скиннутый меш + клипы из остальных FBX (тот же скелет)
    o.traverse((m) => { if (m.isMesh) { m.material = mat; const g = m.geometry; g.deleteAttribute("color"); m.geometry = mergeVertices(g, 1e-4); } });
    const clips = [];
    for (const [name, file] of Object.entries(job.anims)) {
      const src = file === job.fbx ? o : await fbx(file);
      const clip = src.animations[0].clone(); clip.name = name;
      clip.tracks = clip.tracks.filter((t) => !t.name.startsWith(job.rootName + ".") && !t.name.endsWith(".scale"));
      // клип с другого героя (тот же риг Meshy): дорожки костей, которых у этой модели нет, выкидываем
      if (src !== o) clip.tracks = clip.tracks.filter((t) => o.getObjectByName(t.name.slice(0, t.name.lastIndexOf("."))));
      // корневое смещение: бедро стоит на месте по X/Z (бежит «на дорожке»), высоту оставляем
      for (const t of clip.tracks) if (/Hips\.position$/.test(t.name)) {
        const v = t.values, x0 = v[0], z0 = v[2];
        for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; }
      }
      clips.push(clip);
    }
    report.clips = clips.map((c) => [c.name, +c.duration.toFixed(2), c.tracks.length]);
    let tris = 0; o.traverse((m) => { if (m.isMesh) tris += m.geometry.index.count / 3; }); report.tris = tris;
    await save(job.out, o, clips);
  } else {
    // статичный объект: геометрия в мировых координатах, при необходимости — разбиение на части
    let mesh; o.traverse((m) => { if (m.isMesh) mesh = m; });
    let g = mesh.geometry.clone().applyMatrix4(mesh.matrixWorld); g.deleteAttribute("color");
    g = mergeVertices(g, 1e-4);
    const parts = job.split ? splitGeometry(g, job.split) : [g];
    report.parts = [];
    for (let i = 0; i < parts.length; i++) {
      const pg = parts[i]; pg.computeBoundingBox();
      const b = pg.boundingBox, c = b.getCenter(new THREE.Vector3());
      pg.translate(-c.x, -b.min.y, -c.z);
      const m = new THREE.Mesh(pg, mat); m.name = job.out + (parts.length > 1 ? i : "");
      report.parts.push({ name: m.name, tris: pg.index.count / 3, size: b.getSize(new THREE.Vector3()).toArray().map(Math.round) });
      await save(m.name, m);
    }
  }
  window.DONE = report;
} catch (e) { if (e !== null) window.DONE = { error: String(e && e.stack || e) }; }

// Разбить геометрию на отдельные объекты по разрывам между центрами треугольников вдоль оси
function splitGeometry(g, axis) {
  const pos = g.attributes.position, idx = g.index.array;
  const best = (k) => {
    const C = (i) => (k === 0 ? pos.getX(i) : pos.getZ(i));
    const tri = []; for (let t = 0; t < idx.length; t += 3) tri.push((C(idx[t]) + C(idx[t + 1]) + C(idx[t + 2])) / 3);
    const sorted = [...tri].sort((a, b) => a - b);
    let gap = 0, cut = null;
    for (let i = 1; i < sorted.length; i++) if (sorted[i] - sorted[i - 1] > gap) { gap = sorted[i] - sorted[i - 1]; cut = (sorted[i] + sorted[i - 1]) / 2; }
    return { tri, gap, cut };
  };
  const cands = axis === "auto" ? [best(0), best(2)] : [best({ x: 0, z: 2 }[axis])];
  const { tri, cut } = cands.sort((a, b) => b.gap - a.gap)[0];
  const out = [[], []];
  for (let t = 0; t < tri.length; t++) out[tri[t] < cut ? 0 : 1].push(idx[t * 3], idx[t * 3 + 1], idx[t * 3 + 2]);
  return out.map((ix) => { const h = g.clone(); h.setIndex(ix); return compact(h); });
}
function compact(g) { // выкинуть неиспользуемые вершины
  const idx = g.index.array, map = new Map(), order = [];
  for (const i of idx) if (!map.has(i)) { map.set(i, order.length); order.push(i); }
  const out = new THREE.BufferGeometry();
  for (const [name, a] of Object.entries(g.attributes)) {
    const arr = new a.array.constructor(order.length * a.itemSize);
    order.forEach((src, dst) => { for (let c = 0; c < a.itemSize; c++) arr[dst * a.itemSize + c] = a.array[src * a.itemSize + c]; });
    out.setAttribute(name, new THREE.BufferAttribute(arr, a.itemSize, a.normalized));
  }
  out.setIndex(Array.from(idx, (i) => map.get(i)));
  return out;
}
</script>
